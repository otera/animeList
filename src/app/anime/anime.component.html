<mat-card appearance="outlined">
  <mat-form-field>
    <mat-select placeholder="年代" (selectionChange)="onChangeYear($event)">
      @for (y of years; track y) {
        <mat-option [value]="y">
          {{ y.display }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-card>

<table mat-table [dataSource]="animedata" class="mat-elevation-z8">
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>タイトル</th>
    <td mat-cell *matCellDef="let ad">
      <a href="{{ ad.url }}" target="_blank">{{ ad.title_japanese }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>種別</th>
    <td mat-cell *matCellDef="let ad">{{ ad.type }}</td>
  </ng-container>

  <ng-container matColumnDef="score">
    <th mat-header-cell *matHeaderCellDef>スコア</th>
    <td mat-cell *matCellDef="let ad">{{ ad.score ? ad.score : "-" }}</td>
  </ng-container>

  <ng-container matColumnDef="genres">
    <th mat-header-cell *matHeaderCellDef>ジャンル</th>
    <td mat-cell *matCellDef="let ad">{{ ad.genres | genreNames }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
